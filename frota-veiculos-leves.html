<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frota de Veículos Leves</title>
<meta name="description" content="Painel da relação de frota de veículos leves da CRV Industrial, Unidade Capinópolis - MG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Painel da frota de veículos leves, na identidade CRV (a mesma do Controle Agrícola / SIGA-MG):
   barra azul-petróleo com filete verde de 4px, painéis brancos de borda fina, títulos e números em Barlow Condensed.
   Layout: barra CRV > abas + filtros (presos ao rolar no computador) > conteúdo em grade de 12 colunas.
   As cores das categorias foram validadas para daltonismo (claro e escuro); a ordem é fixa: Picape, Moto, Passeio, Utilitário. */
:root{
  color-scheme: light;
  /* barra superior: igual nos dois temas, como no SIGA-MG */
  --topo:#0B2A47; --topo-2:#12385C; --topo-borda:#2A5680; --topo-hover:#164270; --topo-sub:#B9C6D8; --filete:#1A9760;
  --bg:#EEF1EE; --card:#FFFFFF; --card-2:#F7F9F8; --line:#D5DBE1; --line-2:#E7EBEF;
  --ink:#1C2430; --muted:#5C6777; --hover:#ECEFF2; --zebra:#F6F8FA; --subtotal:#E2E6EB;
  --grupo-bg:#DCE8FB; --grupo-ink:#152F5F; --th:#23396B; --th-2:#1C2F5A; --sel:#23396B; --sel-soft:#E3ECFA; --link:#2E5FA8;
  --form-fundo:#EDF2FA; --form-borda:#C8D5EC;
  --cat-1:#2E5FA8; --cat-2:#C9702E; --cat-3:#8E6CC8; --cat-4:#1F9A6A;
  --ok:#1F7A3D; --ok-bg:#E8F5E9; --warn:#8A5D00; --warn-bg:#FFF4D6; --warn-dot:#D9A21B;
  --crit:#B23C2B; --crit-bg:#FFEBEE; --crit-solid:#BE3132; --off:#5C6777; --off-bg:#ECEFF2;
  --placa-faixa:#1F4FA0; --placa-antiga:#8C96A3;
  --sombra:0 1px 2px rgba(16,24,40,.06),0 0 1px rgba(16,24,40,.05);
  --sombra-pop:0 12px 32px rgba(16,24,40,.16),0 2px 6px rgba(16,24,40,.08);
  --f-display:"Barlow Condensed","Arial Narrow",Inter,sans-serif;
  --f-body:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
  --r-sm:4px; --r-md:6px; --r-lg:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0B1321; --card:#131F33; --card-2:#17253C; --line:#2A3954; --line-2:#1F2D45;
    --ink:#E6EBF4; --muted:#93A0B8; --hover:#1E2D46; --zebra:#16233A; --subtotal:#22314B;
    --grupo-bg:#233554; --grupo-ink:#DBE6F7; --th:#1C2F5A; --th-2:#16264A; --sel:#2D4A85; --sel-soft:#1F3355; --link:#8DB3EE;
    --form-fundo:#1D2F47; --form-borda:#344E70;
    --cat-1:#5A87D6; --cat-2:#D07A3A; --cat-3:#9877CF; --cat-4:#2AA673;
    --ok:#6FD39A; --ok-bg:rgba(31,122,61,.25); --warn:#F0C25A; --warn-bg:rgba(217,162,27,.18); --warn-dot:#E3B341;
    --crit:#F4978A; --crit-bg:rgba(201,74,55,.22); --crit-solid:#C94A37; --off:#A3AEC2; --off-bg:#22314B;
    --placa-faixa:#3B66C4; --placa-antiga:#6F7A8A;
    --sombra:0 1px 2px rgba(0,0,0,.35); --sombra-pop:0 14px 36px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0B1321; --card:#131F33; --card-2:#17253C; --line:#2A3954; --line-2:#1F2D45;
  --ink:#E6EBF4; --muted:#93A0B8; --hover:#1E2D46; --zebra:#16233A; --subtotal:#22314B;
  --grupo-bg:#233554; --grupo-ink:#DBE6F7; --th:#1C2F5A; --th-2:#16264A; --sel:#2D4A85; --sel-soft:#1F3355; --link:#8DB3EE;
  --form-fundo:#1D2F47; --form-borda:#344E70;
  --cat-1:#5A87D6; --cat-2:#D07A3A; --cat-3:#9877CF; --cat-4:#2AA673;
  --ok:#6FD39A; --ok-bg:rgba(31,122,61,.25); --warn:#F0C25A; --warn-bg:rgba(217,162,27,.18); --warn-dot:#E3B341;
  --crit:#F4978A; --crit-bg:rgba(201,74,55,.22); --crit-solid:#C94A37; --off:#A3AEC2; --off-bg:#22314B;
  --placa-faixa:#3B66C4; --placa-antiga:#6F7A8A;
  --sombra:0 1px 2px rgba(0,0,0,.35); --sombra-pop:0 14px 36px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);letter-spacing:-.003em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1480px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:.01em}
.mut{color:var(--muted)}

/* ---------- barra CRV ---------- */
.topo{background:var(--topo);color:#fff;border-bottom:4px solid var(--filete)}
.topo-in{display:flex;align-items:center;gap:14px 18px;min-height:76px;padding-block:10px;flex-wrap:wrap}
.marca-sis{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.marca-sis .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--topo-sub)}
.marca-sis h1{font:600 30px/1.02 var(--f-display);margin:2px 0 0;letter-spacing:.005em;text-wrap:balance}
.posicao{display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-size:11.5px;color:var(--topo-sub);white-space:nowrap}
.posicao b{color:#fff;font:600 17px/1.1 var(--f-display);letter-spacing:.02em}
.posicao .pend{color:#F6D27A;font-weight:600}
.acoes{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn-topo{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:10px;background:var(--topo-2);border:1px solid var(--topo-borda);color:#E8EEF6;font-size:13px;font-weight:500;white-space:nowrap}
.btn-topo:hover{background:var(--topo-hover);color:#fff}
.btn-topo.so-ic{width:38px;padding:0;justify-content:center}
.logo-div{width:1px;height:36px;background:rgba(255,255,255,.2)}
.logo{height:30px;width:auto;display:block}
@media (max-width:1100px){
  .btn-topo .rot{display:none}
  .btn-topo{width:38px;padding:0;justify-content:center}
}
@media (max-width:760px){
  .topo-in{min-height:60px}
  .marca-sis h1{font-size:25px}
  .posicao{align-items:flex-start;order:3;width:100%;flex-direction:row;gap:8px;align-items:baseline}
  .logo{height:22px}
}

/* ---------- abas + filtros ---------- */
.faixa{background:var(--card);border-bottom:1px solid var(--line);z-index:20}
@media (min-width:900px){.faixa{position:sticky;top:env(safe-area-inset-top,0px)}}
.abas{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.aba{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:13px 14px 10px;font-weight:600;font-size:13.5px;color:var(--muted);display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.aba:hover{color:var(--ink)}
.aba[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--filete)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.badge.crit{background:var(--crit-bg);color:var(--crit)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:10px;border-top:1px solid var(--line-2)}
.grupo-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:#fff}
.chip .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.chip[aria-pressed="true"] .n{color:#CFDAEC}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn-dot)} .dot.off{background:var(--off)} .dot.crit{background:var(--crit-solid)}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.sel{height:32px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);padding:0 8px;font-size:12.5px;max-width:210px;min-width:0}
.sel.ativo{border-color:var(--link);box-shadow:inset 0 0 0 1px var(--link);font-weight:600}
.busca{position:relative;flex:1 1 200px;max-width:320px;min-width:160px}
.busca input{width:100%;height:32px;border:1px solid var(--line);border-radius:var(--r-md);padding:0 10px 0 32px;background:var(--card);font-size:13px}
.busca svg{position:absolute;left:10px;top:8px;color:var(--muted)}
.contagem{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.contagem b{color:var(--ink);font-variant-numeric:tabular-nums}
.link{border:0;background:none;color:var(--link);font-weight:600;font-size:12.5px;padding:6px 4px}
.link:hover{text-decoration:underline}
.nota-faixa{font-size:12.5px;color:var(--muted);padding-block:10px;border-top:1px solid var(--line-2)}

/* ---------- conteúdo ---------- */
main{padding-block:18px 56px}
.vista{display:grid;gap:16px}
.grade{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c7{grid-column:span 7}.c5{grid-column:span 5}.c6{grid-column:span 6}
@media (max-width:1060px){.c7,.c5,.c6{grid-column:span 12}}
.painel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sombra);min-width:0}
.painel-h{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;padding:14px 16px 0}
.painel-h h2{font:600 20px/1.15 var(--f-display);margin:0;letter-spacing:.01em}
.painel-h .sub{font-size:12px;color:var(--muted)}
.painel-h .dir{margin-left:auto}
.painel-b{padding:12px 16px 16px}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1060px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}.kpis>:nth-child(-n+3){grid-column:span 2}.kpis>:nth-child(n+4){grid-column:span 3}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis>*{grid-column:auto!important}.kpis>:last-child{grid-column:1/-1!important}}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px 13px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--sombra);min-width:0}
.kpi:hover{border-color:var(--muted)}
.kpi:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.kpi[aria-pressed="true"]{border-color:var(--link);box-shadow:inset 0 0 0 1px var(--link),var(--sombra)}
.kpi .rot{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.kpi .val{font:600 44px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em;margin-top:2px}
.kpi .det{font-size:12px;color:var(--muted)}
.kpi.alerta .val{color:var(--crit)}
.kpi .pill{align-self:flex-start;margin-top:4px}

/* composição */
.comp{display:flex;gap:2px;height:24px}
.comp-seg{height:100%;min-width:4px;cursor:pointer;transition:opacity .15s}
.comp-seg:first-child{border-radius:4px 0 0 4px}.comp-seg:last-child{border-radius:0 4px 4px 0}.comp-seg:only-child{border-radius:4px}
.comp.tem-sel .comp-seg:not(.on){opacity:.3}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px}
.leg-i{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;border:0;background:none;padding:3px 6px;margin-left:-6px;border-radius:var(--r-sm)}
.leg-i:hover{background:var(--hover)}
.leg-i b{font-variant-numeric:tabular-nums}
.leg-i .p{color:var(--muted);font-variant-numeric:tabular-nums}
.leg-i.on{background:var(--sel-soft)}
.sw{width:10px;height:10px;border-radius:2px;flex:none;display:inline-block}
.comp-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px 32px;align-items:start}
@media (max-width:860px){.comp-grid{grid-template-columns:minmax(0,1fr)}}
.fatos{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:12.5px;margin:0}
.fatos dt{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.fatos dd{margin:0;display:flex;flex-wrap:wrap;gap:2px 12px}
.fatos dd span b{font-variant-numeric:tabular-nums}
.fato-btn{border:0;background:none;padding:0 2px;border-radius:3px;font-size:12.5px}
.fato-btn:hover{background:var(--hover)} .fato-btn.on{background:var(--sel-soft);font-weight:600}

/* barras horizontais */
.hb{display:grid;gap:3px}
.hb-row{display:grid;grid-template-columns:minmax(104px,34%) minmax(0,1fr) 34px;align-items:center;gap:10px;padding:4px 6px;margin:0 -6px;border-radius:var(--r-md)}
.hb-row[data-acao]{cursor:pointer}
.hb-row[data-acao]:hover,.hb-row[data-acao]:focus-visible{background:var(--hover)}
.hb-row.on{background:var(--sel-soft)}
.hb-row.on .hb-lab{font-weight:700}
.hb-row.dim .hb-bar{opacity:.32}
.hb-lab{font-size:12.5px;line-height:1.25;overflow-wrap:anywhere}
.hb-lab small{display:block;color:var(--muted);font-size:11px}
.hb-track{height:16px;display:flex;align-items:stretch}
.hb-bar{display:flex;gap:2px;height:100%;min-width:3px}
.hb-seg{height:100%;min-width:3px}
.hb-seg:last-child{border-radius:0 4px 4px 0}
.hb-val{font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px;text-align:right}
.mais{margin-top:8px}
.vazio{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
.vazio b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

/* tabelas */
.tab-wrap{overflow:auto;max-width:100%}
.tab-wrap.alta{max-height:calc(100vh - 250px);min-height:260px}
@media (max-width:899px){.tab-wrap.alta{max-height:none}}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.t th,.t td{padding:7px 10px;text-align:left;vertical-align:middle}
.t thead th{position:sticky;top:0;z-index:2;background:var(--th);color:#fff;font-weight:600;font-size:12px;letter-spacing:.02em;white-space:nowrap;border-right:1px solid rgba(255,255,255,.08)}
.t thead th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.t thead th button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.t thead th .seta{opacity:.55;font-size:10px}
.t thead th[aria-sort] .seta{opacity:1}
.t td{background:var(--card);border-bottom:1px solid var(--line-2)}
.t.det td{white-space:nowrap}
.t tr.z td{background:var(--zebra)}
.t tr.grupo td{background:var(--grupo-bg);color:var(--grupo-ink);font-weight:600;border-bottom:0}
.t tr.subtotal td{background:var(--subtotal);font-weight:600}
.t tfoot td{background:var(--th);color:#fff;font-weight:700;border:0}
.t .r{text-align:right;font-variant-numeric:tabular-nums}
.t .c{text-align:center}
.t .zero{color:var(--muted)}
.t tr.linha{cursor:pointer}
.t tr.linha:hover td{background:var(--hover)}
.t tr.linha:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
.t td.col-fixa,.t th.col-fixa{position:sticky;left:0;z-index:1}
.t thead th.col-fixa{z-index:3}
.t .nivel-area td:first-child{padding-left:26px}
.g-tit{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.g-tit .g-n{font-weight:500;font-size:12px;opacity:.85}
.g-cats{display:inline-flex;gap:10px;font-weight:500;font-size:11.5px;opacity:.9;flex-wrap:wrap}
.g-cats span{display:inline-flex;align-items:center;gap:5px}
.tab-total{font-size:12px;color:var(--muted);padding:10px 16px}

/* elementos das linhas */
.placa{display:inline-block;font:600 11.5px/1 var(--f-mono);letter-spacing:.07em;padding:4px 6px 3px;border:1px solid var(--line);border-top:3px solid var(--placa-faixa);border-radius:3px;background:var(--card);color:var(--ink);white-space:nowrap}
.placa.antiga{border-top-color:var(--placa-antiga)}
.placa.invalida{border-top-color:var(--crit-solid)}
.cat{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.off{background:var(--off-bg);color:var(--off)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.info{background:var(--sel-soft);color:var(--link)}
.flag{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;margin-left:6px;vertical-align:-4px}
.flag svg{width:13px;height:13px}
.flag.crit{background:var(--crit-bg);color:var(--crit)}
.flag.warn{background:var(--warn-bg);color:var(--warn)}
.sem{color:var(--muted);font-style:italic}
.ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:var(--r-md);border:1px solid transparent;background:none;color:var(--muted)}
.ic:hover{background:var(--hover);color:var(--ink);border-color:var(--line)}

/* barra de ferramentas do detalhamento */
.ferr{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.ferr label{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.ferr .sp{flex:1}
.checks{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;align-items:center}
.checks .rot{color:var(--muted)}
.checks label{color:var(--ink)!important}
input[type="checkbox"],input[type="radio"]{accent-color:var(--sel);width:15px;height:15px;margin:0}

/* botões */
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--th);border-color:var(--th);color:#fff}
.btn.pri:hover{background:var(--th-2)}
.btn.verde{background:#2D8A5A;border-color:#2D8A5A;color:#fff}
.btn.verde:hover{background:#25744B}
.btn.perigo{color:var(--crit)}
.btn.perigo.confirmar{background:var(--crit-solid);border-color:var(--crit-solid);color:#fff}
.btn.peq{height:30px;padding:0 10px;font-size:12.5px}

/* conferência */
.conf-resumo{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.conf-resumo .grande{font:600 34px/1 var(--f-display)}
.regra{border-top:1px solid var(--line)}
.regra:first-child{border-top:0}
.regra-h{display:flex;gap:10px 12px;align-items:flex-start;padding:14px 16px 8px;flex-wrap:wrap}
.regra-h h3{margin:0;font-size:14.5px;font-weight:600}
.regra-h p{margin:3px 0 0;font-size:12.5px;color:var(--muted);max-width:75ch}
.regra-h .pill{margin-top:1px}
.regra .tab-wrap{padding:0 16px 14px}
.regra table.t{border:1px solid var(--line-2);border-radius:var(--r-md);overflow:hidden}
.oks{list-style:none;margin:0;padding:6px 16px 14px;display:grid;gap:6px;font-size:13px}
.oks li{display:flex;gap:8px;align-items:center}
.oks svg{color:var(--ok)}

/* gaveta de edição e janelas */
.fundo{position:fixed;inset:0;background:rgba(6,14,26,.5);z-index:50}
.gaveta{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--card);z-index:51;box-shadow:var(--sombra-pop);display:flex;flex-direction:column}
.gaveta-h{background:var(--topo);color:#fff;border-bottom:4px solid var(--filete);padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:flex-start}
.gaveta-h .eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--topo-sub)}
.gaveta-h h2{margin:2px 0 0;font:600 24px/1.1 var(--f-display)}
.gaveta-h .ic{color:#fff;margin-left:auto}
.gaveta-h .ic:hover{background:rgba(255,255,255,.12);border-color:transparent}
.gaveta-b{overflow:auto;padding:16px 18px 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-content:start;flex:1}
.gaveta-p{border-top:1px solid var(--line);padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gaveta-p .sp{flex:1}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo.l2{grid-column:1/-1}
.campo label{font-size:12px;font-weight:600;color:var(--muted)}
.campo label .req{color:var(--crit)}
.campo input,.campo select,.campo textarea{height:38px;border:1px solid var(--form-borda);border-radius:var(--r-md);background:var(--form-fundo);padding:0 10px;font-size:13.5px;width:100%;min-width:0}
.campo textarea{height:68px;padding:8px 10px;resize:vertical}
.campo input.mono{font-family:var(--f-mono);letter-spacing:.04em;text-transform:uppercase}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--link);outline-offset:0;border-color:transparent}
.dica-campo{font-size:11.5px;min-height:15px;color:var(--muted)}
.dica-campo.av{color:var(--warn)}
.dica-campo.erro{color:var(--crit);font-weight:600}
.dica-campo.ok{color:var(--ok)}
.secao-form{grid-column:1/-1;font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:6px;border-top:1px solid var(--line-2);margin-top:4px}
.callout{grid-column:1/-1;border-radius:var(--r-md);padding:10px 12px;font-size:12.5px;display:grid;gap:4px}
.callout.crit{background:var(--crit-bg);color:var(--ink)}
.callout.crit b{color:var(--crit)}
.callout ul{margin:0;padding-left:18px}
@media (max-width:520px){.gaveta-b{grid-template-columns:minmax(0,1fr)}}
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--card);border-radius:10px;box-shadow:var(--sombra-pop);border:1px solid var(--line)}
.modal-h{padding:16px 20px 4px}
.modal-h h2{margin:0;font:600 24px/1.1 var(--f-display)}
.modal-b{padding:8px 20px 4px;display:grid;gap:14px;font-size:13.5px}
.modal-b p{margin:0}
.modal-b fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
.modal-b legend{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;padding:0}
.modal-b label{display:flex;gap:9px;align-items:flex-start;line-height:1.35}
.modal-b label input{margin-top:2px}
.modal-b label small{display:block;color:var(--muted);font-size:12px}
.modal-b .linha-op{display:flex;gap:18px;flex-wrap:wrap}
.modal-p{padding:16px 20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.resumo-imp{background:var(--card-2);border:1px solid var(--line-2);border-radius:var(--r-md);padding:10px 12px;display:grid;gap:4px;font-size:13px}

/* dica flutuante e aviso */
.dica{position:fixed;z-index:60;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sombra-pop);border-radius:var(--r-md);padding:8px 10px;font-size:12px;display:grid;gap:2px;max-width:280px}
.dica b{font-weight:600;font-size:12.5px}
.dica span{color:var(--muted)}
.aviso{position:fixed;z-index:70;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(420px,calc(100% - 32px));background:var(--topo);color:#fff;border-left:4px solid var(--filete);border-radius:var(--r-md);padding:11px 14px;font-size:13px;box-shadow:var(--sombra-pop)}
.aviso.erro{border-left-color:#E0705F}

/* alterações */
.mudou{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.mudou del{color:var(--muted);text-decoration:line-through}
.mudou ins{text-decoration:none;font-weight:600}

/* ---------- impressão ---------- */
#impressao{display:none}
.imp-cab{display:flex;align-items:center;gap:18px;border-bottom:3px solid var(--filete);padding-bottom:8px;margin-bottom:12px}
.imp-cab img{height:42px;width:auto}
.imp-org{font-size:8.5pt;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.imp-cab h1{font:600 21pt/1.05 var(--f-display);margin:2px 0;color:var(--th)}
.imp-meta{font-size:8.5pt;color:var(--muted)}
.imp-sec + .imp-sec{break-before:page}
.imp-tit{font:600 15pt/1.1 var(--f-display);margin:0 0 8px;color:var(--th)}
@page{margin:11mm 9mm 13mm;
  @bottom-left{content:"Frota de Veículos Leves · CRV Industrial · Unidade Capinópolis - MG";font:7.5pt Inter,Arial,sans-serif;color:#5C6777}
  @bottom-right{content:"Página " counter(page) " de " counter(pages);font:7.5pt Inter,Arial,sans-serif;color:#5C6777}
}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff!important}
  body{font-size:10pt}
  body > :not(#impressao){display:none!important}
  #impressao{display:block}
  .painel{box-shadow:none;break-inside:avoid}
  .kpi,.kpi[aria-pressed="true"]{box-shadow:none;border-color:var(--line)}
  .grade{gap:10px}
  .vista{gap:10px}
  .tab-wrap,.tab-wrap.alta{overflow:visible;max-height:none;min-height:0}
  table.t{font-size:8pt}
  .t th,.t td{padding:4px 6px}
  .t thead{display:table-header-group}
  .t thead th{position:static}
  .t td.col-fixa,.t th.col-fixa{position:static}
  .t tr{break-inside:avoid}
  .t tr.grupo{break-after:avoid}
  .regra{break-inside:avoid}
  .hb-row{padding:2px 6px}
  .kpi .val{font-size:32px}
  .placa{font-size:8pt;padding:2px 4px 1px}
  .pill{height:auto;padding:1px 6px;font-size:7.5pt}
}
@media print and (orientation:landscape){.c7{grid-column:span 7}.c5{grid-column:span 5}.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

const REGRAS = {

const REGRAS_ORD = Object.keys(REGRAS);

const VERIF_OK = {
  'frota-dup': 'Números de frota sem repetição', 'placa-dup': 'Placas sem repetição', 'vendido-ativo': 'Nenhum vendido aparece na relação ativa',
  'chassi-dup': 'Chassis sem repetição', 'renavam-dup': 'RENAVAM sem repetição', 'chassi-tam': 'Todos os chassis com 17 caracteres',
  'chassi-marca': 'Fabricante do chassi confere com a marca', 'renavam-dv': 'Dígito verificador do RENAVAM confere em todos', 'placa-fmt': 'Todas as placas no formato Mercosul ou antigo',
  'sem-chassi': 'Todos os ativos têm chassi', 'sem-renavam': 'Todos os ativos têm RENAVAM', 'sem-usuario': 'Todos os veículos têm usuário',
};
function conferir(lista) {
  const oc = [], vistos = new Set();
  const add = (regra, vs, valor) => {
    const k = regra + '|' + vs.map(v => v.id).sort().join(',');
    if (vistos.has(k)) return; vistos.add(k);
    oc.push({ regra, ids: vs.map(v => v.id), valor });
  };
  const dup = (campo, regra) => {
    const m = new Map();
    for (const v of lista) { const k = String(v[campo] ?? '').trim().toUpperCase(); if (!k) continue; if (!m.has(k)) m.set(k, []); m.get(k).push(v); }
    for (const [k, vs] of m) if (vs.length > 1) {
      const misto = vs.some(v => v.secao === 0) && vs.some(v => v.secao !== 0);
      if (misto) add('vendido-ativo', vs, k);
      else if (!vs.every(v => v.secao === 0)) add(regra, vs, k);
    }
  };
  dup('frota', 'frota-dup'); dup('placa', 'placa-dup'); dup('chassi', 'chassi-dup'); dup('renavam', 'renavam-dup');
  for (const v of lista) {
    const c = String(v.chassi || '').toUpperCase();
    const ativo = v.secao !== 0;
    if (!c) { if (ativo) add('sem-chassi', [v], ''); }
    else if (c.length !== 17) add('chassi-tam', [v], `${c} (${c.length} caracteres)`);
    else { const f = WMI[c.slice(0, 3)]; if (f && v.marca !== 'Outra' && f !== v.marca) add('chassi-marca', [v], `${c.slice(0, 3)} = ${f}; cadastro: ${v.marca}`); }
    if (ativo) {
      if (!v.renavam) add('sem-renavam', [v], '');
      else if (!renavamOk(v.renavam)) add('renavam-dv', [v], v.renavam);
      if (!v.usuario) add('sem-usuario', [v], '');
    }
    if (placaTipo(v.placa) === 'invalida') add('placa-fmt', [v], v.placa || '(vazia)');
  }
  const porVeic = new Map();
  for (const o of oc) for (const id of o.ids) { if (!porVeic.has(id)) porVeic.set(id, []); porVeic.get(id).push(o); }
  return { oc, porVeic };
}

/* ================= Conferência ================= */
function htmlConferencia(imp = false) {
  const porRegra = new Map();
  for (const o of CONF.oc) { if (!porRegra.has(o.regra)) porRegra.set(o.regra, []); porRegra.get(o.regra).push(o); }
  const byId = new Map(E.map(v => [v.id, v]));
  const nPend = veicComPend().length;
  const nCrit = CONF.oc.filter(o => REGRAS[o.regra].sev === 'crit').length, nWarn = CONF.oc.filter(o => REGRAS[o.regra].sev === 'warn').length;
  const topo = `<div class="painel"><div class="painel-b conf-resumo">
      <div><div class="grande" style="color:${nPend ? 'var(--crit)' : 'var(--ok)'}">${nf(nPend)}</div><div class="mut" style="font-size:12.5px">${nPend ? 'veículos com pendência' : 'nenhuma pendência'}</div></div>
      <span class="pill crit"><i class="dot crit"></i>${plural(nCrit, 'ocorrência para corrigir', 'ocorrências para corrigir')}</span>
      <span class="pill warn"><i class="dot warn"></i>${plural(nWarn, 'para conferir', 'para conferir')}</span>
      <span class="mut" style="font-size:12.5px;max-width:60ch">A conferência olha os ${nf(E.length)} veículos da planilha (relação e vendidos), sem os filtros. Clique em um veículo para corrigir.</span>
    </div></div>`;
  let regras = '';
  for (const r of REGRAS_ORD) {
    const ocs = porRegra.get(r); if (!ocs) continue;
    const R = REGRAS[r], dupl = r.endsWith('-dup') || r === 'vendido-ativo';
    let linhas = '';
    for (const o of ocs) {
      if (dupl) linhas += `<tr class="subtotal"><td colspan="${imp ? 6 : 7}">${esc(o.valor)} · ${plural(o.ids.length, 'veículo', 'veículos')}</td></tr>`;
      o.ids.forEach((id, i) => {
        const v = byId.get(id); if (!v) return;
        linhas += `<tr class="linha${i % 2 ? ' z' : ''}"${imp ? '' : ` data-acao="editar" data-id="${esc(id)}" tabindex="0"`}><td><b class="num">${esc(v.frota)}</b></td><td>${htmlPlaca(v.placa)}</td><td>${esc(v.modelo)}</td><td>${esc(v.secao === 0 ? 'Vendido' : [v.setor, v.area].filter(Boolean).join(' · '))}</td><td class="mono">${esc(v.chassi) || '—'}</td><td class="mono">${esc(v.renavam) || '—'}${!dupl && o.valor && r !== 'chassi-tam' && r !== 'renavam-dv' ? `<div class="mut" style="font-family:var(--f-body)">${esc(o.valor)}</div>` : ''}</td>${imp ? '' : `<td class="c"><button class="btn peq" data-acao="editar" data-id="${esc(id)}">${IC.lapis} Corrigir</button></td>`}</tr>`;
      });
    }
    regras += `<div class="regra"><div class="regra-h"><span class="pill ${SEV[R.sev].cls}">${SEV[R.sev].rot}</span><div><h3>${esc(R.t)} · ${plural(ocs.length, 'caso', 'casos')}</h3><p>${esc(R.d)}</p></div></div>
      <div class="tab-wrap"><table class="t"><thead><tr><th>Frota</th><th>Placa</th><th>Marca / modelo</th><th>Setor · área</th><th>Chassi</th><th>RENAVAM</th>${imp ? '' : '<th></th>'}</tr></thead><tbody>${linhas}</tbody></table></div></div>`;
  }
  const oks = REGRAS_ORD.filter(r => !porRegra.has(r));
  const painelOk = oks.length ? `<div class="painel"><div class="painel-h"><h2>Verificações sem pendência</h2></div><ul class="oks">${oks.map(r => `<li>${IC.ok}${esc(VERIF_OK[r])}</li>`).join('')}</ul></div>` : '';
  return topo + (regras ? `<div class="painel">${regras}</div>` : '') + painelOk;
}

function irAba(a) {

/* ================= dica flutuante e aviso ================= */
const dica = $('#dica');
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-dica]');
  if (!t) { dica.hidden = true; return; }
  const [h, ...ls2] = t.dataset.dica.split('|');
  dica.innerHTML = `<b>${esc(h)}</b>${ls2.map(l => `<span>${esc(l)}</span>`).join('')}`;
  dica.hidden = false;
});
document.addEventListener('mousemove', e => {
  if (dica.hidden) return;
  const w = dica.offsetWidth, h = dica.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 12;
  dica.style.left = Math.max(8, x) + 'px'; dica.style.top = Math.max(8, y) + 'px';
});
document.addEventListener('scroll', () => { dica.hidden = true; }, true);
function toast(msg, tipo = 'ok') {
  const t = $('#aviso'); t.textContent = msg; t.className = 'aviso ' + tipo; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, tipo === 'erro' ? 7000 : 4000);
}

function lerForm() {

function validarForm() {

function salvarEditor() {
  if (!validarForm()) { toast('Corrija os campos marcados em vermelho.', 'erro'); $('#camada .dica-campo.erro')?.previousElementSibling?.focus(); return; }
  const f = lerForm();
  const dados = { frota: +f.frota, placa: f.placa, modelo: f.modelo, categoria: f.categoria, usuario: f.usuario, setor: f.setor, area: f.area, uf: f.uf, prop: f.prop, chassi: f.chassi, renavam: f.renavam, secao: secaoDe(f.sit, f.vinc), obs: f.obs };

    registrar('inclusão', v, { rot: '', resumo: `${v.modelo} · ${SECAO_CURTA[v.secao]}` });
    toast(`Frota ${v.frota} incluída.`);
  } else {
    const v = db.atual.find(x => x.id === editId);
    const mud = Object.keys(CAMPOS).filter(k => String(v[k] ?? '') !== String(dados[k] ?? ''));
    if (!mud.length) { fecharCamada(); toast('Nada mudou.'); return; }
    for (const k of mud) registrar('edição', { ...v, ...dados }, { campo: k, rot: CAMPOS[k], de: v[k] ?? '', para: dados[k] });

}

let xlsxP = null;
function carregarXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (!xlsxP) xlsxP = new Promise((ok, falha) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ok; s.onerror = () => { xlsxP = null; falha(new Error('xlsx')); };
    document.head.appendChild(s);
  });
  return xlsxP;
}
const erroXLSX = () => toast('Não consegui carregar o componente de Excel. Ele vem da internet: confira a conexão e tente de novo.', 'erro');
function lerPlanilha(wb) {
  const veiculos = []; let dataBase = null, ordemN = 0, folha = '';
  const linhas = nome => XLSX.utils.sheet_to_json(wb.Sheets[nome], { header: 1, raw: true, defval: null, blankrows: true });
  const s = v => limpa(v);
  for (const nome of wb.SheetNames) {
    if (/vendid/i.test(nome)) continue;
    const rows = linhas(nome);
    if (!rows.some(r => r && norm(r[0]) === 'item' && norm(r[2]) === 'frota')) continue;
    folha = nome;
    const ws = wb.Sheets[nome];
    for (let r = 0; r < 8 && !dataBase; r++) for (let c = 0; c < 16; c++) {
      const cel = ws[XLSX.utils.encode_cell({ r, c })];
      if (cel && cel.t === 'n' && cel.z && XLSX.SSF.is_date(cel.z)) { const p = XLSX.SSF.parse_date_code(cel.v); dataBase = `${p.y}-${pad2(p.m)}-${pad2(p.d)}`; break; }
      if (cel && cel.t === 'd' && cel.v instanceof Date) { dataBase = `${cel.v.getFullYear()}-${pad2(cel.v.getMonth() + 1)}-${pad2(cel.v.getDate())}`; break; }
    }
    let secao = null;
    for (const r of rows) {
      if (!r) continue;
      const a = r[0];
      if (typeof a === 'string' && /^\s*\d+\./.test(a)) { secao = +a.match(/^\s*(\d+)\./)[1]; continue; }
      if (typeof r[2] === 'number' && r[3]) {
        ordemN++;
        veiculos.push({ id: uid() + ordemN, frota: Math.trunc(r[2]), placa: s(r[3]).toUpperCase(), modelo: s(r[5] ?? r[4]), usuario: s(r[6]), setor: s(r[7]), area: s(r[8]), chassi: s(r[9]).toUpperCase(), renavam: r[10] == null ? '' : String(typeof r[10] === 'number' ? Math.trunc(r[10]) : s(r[10])), prop: s(r[11]), uf: s(r[12]).toUpperCase(), obs: s(r[13]), categoria: '', secao: [1, 2, 3].includes(secao) ? secao : 1, ordem: ordemN });
      }
    }
    break;
  }
  const nv = wb.SheetNames.find(n => /vendid/i.test(n));
  if (nv) for (const r of linhas(nv)) if (r && typeof r[0] === 'number') {
    ordemN++;
    veiculos.push({ id: uid() + ordemN, frota: Math.trunc(r[0]), placa: s(r[1]).toUpperCase(), modelo: s(r[2]), chassi: s(r[3]).toUpperCase(), usuario: '', setor: '', area: '', renavam: '', prop: 'CRV', uf: '', obs: '', categoria: '', secao: 0, ordem: ordemN });
  }
  return { dataBase, veiculos, folha };
}

}
window.addEventListener('beforeprint', () => {
  if (!impPronta) montarImpressao({ resumo: true, detalhe: true, conf: false, todos: false, orientacao: 'landscape', docs: true });
  temaAntes = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', 'light');
});
window.addEventListener('afterprint', () => {
  impPronta = false;
  if (temaAntes) document.documentElement.setAttribute('data-theme', temaAntes); else document.documentElement.removeAttribute('data-theme');
});

/* ================= eventos ================= */
const ACOES = {
  aba: a => irAba(a.dataset.valor),
  sit: a => { const s = a.dataset.valor; F.sit.has(s) ? F.sit.delete(s) : F.sit.add(s); render(); },
  kpi: a => { const arr = a.dataset.valor.split('|'); const igual = F.sit.size === arr.length && arr.every(s => F.sit.has(s)); F.sit = new Set(igual && arr.join() !== SIT_PADRAO.join() ? SIT_PADRAO : arr); render(); },
  filtro: a => { const d = a.dataset.dim, v = a.dataset.valor; F[d] = F[d] === v ? '' : v; render(); },
  limpar: () => { limparFiltros(); render(); },
  areas: () => { areasTodas = !areasTodas; render(); },
  ordenar: a => { const c = a.dataset.valor; if (!c) ordem = { col: '', dir: 1 }; else if (ordem.col !== c) ordem = { col: c, dir: 1 }; else if (ordem.dir === 1) ordem.dir = -1; else ordem = { col: '', dir: 1 }; render(); },
  editar: a => abrirEditor(a.dataset.id),
  novo: () => abrirEditor(null),
  fechar: () => fecharCamada(),
  excluir: a => excluirVeiculo(a),
  importar: () => { const i = $('#arquivo'); i.value = ''; i.click(); },
  'importar-ok': () => confirmarImportacao(),
  exportar: () => exportarExcel(),
  descartar: a => descartar(a),
  imprimir: () => abrirImpressao(),
  'imprimir-ok': () => {
    const o = { resumo: $('#i-resumo').checked, detalhe: $('#i-detalhe').checked, conf: $('#i-conf').checked, todos: $('#i-todos').checked, orientacao: $('#i-retrato').checked ? 'portrait' : 'landscape', docs: $('#i-docs').checked };
    if (!o.resumo && !o.detalhe && !o.conf) { toast('Marque pelo menos uma parte para imprimir.', 'erro'); return; }
    montarImpressao(o); fecharCamada(); setTimeout(() => window.print(), 60);
  },
  tema: () => { ui.tema = escuro() ? 'light' : 'dark'; salvarUi(); aplicarTema(); },
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-acao]');
  if (!a || a.disabled) return;
  // um clique no botão de editar dentro da linha não deve disparar duas vezes
  if (a.tagName === 'TR' && e.target.closest('button')) return;
  const f = ACOES[a.dataset.acao]; if (f) { e.preventDefault(); f(a, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && camadaAberta()) { fecharCamada(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-acao]:not(button):not(input):not(select)')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === '/' && !camadaAberta() && !e.target.matches('input,textarea,select') && !$('#filtros').hidden) { e.preventDefault(); $('#f-busca').focus(); }
  if (e.key === 'Tab' && camadaAberta()) {
    const foc = $$('#camada button:not([disabled]),#camada input:not([disabled]),#camada select:not([disabled]),#camada textarea').filter(x => x.offsetParent);
    if (!foc.length) return;
    const i = foc.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); foc[foc.length - 1].focus(); }
    else if (!e.shiftKey && i === foc.length - 1) { e.preventDefault(); foc[0].focus(); }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('#f-sels select')) { F[t.dataset.dim] = t.value; render(); }
  else if (t.id === 'd-agrupar') { ui.agrupar = t.value; salvarUi(); render(); }
  else if (t.matches('[data-col]')) { ui.colunas[t.dataset.col] = t.checked; salvarUi(); render(); }
  else if (t.closest('#ed-form')) validarForm();
  else if (t.id === 'arquivo' && t.files[0]) importarArquivo(t.files[0]);
});
document.addEventListener('input', e => {
  if (e.target.id === 'f-busca') { clearTimeout(ACOES.tb); ACOES.tb = setTimeout(() => { F.busca = e.target.value; render(); }, 160); }
  else if (e.target.closest('#ed-form')) validarForm();
});
document.addEventListener('submit', e => { if (e.target.id === 'ed-form') { e.preventDefault(); salvarEditor(); } });
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (ABAS.includes(h) && h !== ui.aba) irAba(h); });
// arrastar a planilha para a janela também importa
document.addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => { const f = e.dataTransfer?.files?.[0]; if (f && /\.xls[xm]?$/i.test(f.name)) { e.preventDefault(); importarArquivo(f); } });

/* ================= início ================= */
aplicarTema();
const h0 = location.hash.slice(1);
ui.aba = ABAS.includes(h0) ? h0 : (ABAS.includes(ui.aba) ? ui.aba : 'resumo');
irAba(ui.aba);
})();
</script>
</body>
